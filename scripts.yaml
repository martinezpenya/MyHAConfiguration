ventilador_despatx_on:
  alias: Ventilador despatx ON
  sequence:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ states('input_number.ventilador_despatx_rf_on_index') | int(1) == 1 }}"
          sequence:
            - service: mqtt.publish
              data:
                topic: "cmnd/sonoffRF433/Backlog"
                payload: "RfRaw AAA54BDC012202EE0A215C55; RfRaw 0"
            - service: input_number.set_value
              target:
                entity_id: input_number.ventilador_despatx_rf_on_index
              data:
                value: 2
        - conditions:
            - condition: template
              value_template: "{{ states('input_number.ventilador_despatx_rf_on_index') | int(1) == 2 }}"
          sequence:
            - service: mqtt.publish
              data:
                topic: "cmnd/sonoffRF433/Backlog"
                payload: "RfRaw AAA54560012202F80A215A55; RfRaw 0"
            - service: input_number.set_value
              target:
                entity_id: input_number.ventilador_despatx_rf_on_index
              data:
                value: 3
        - conditions:
            - condition: template
              value_template: "{{ states('input_number.ventilador_despatx_rf_on_index') | int(1) == 3 }}"
          sequence:
            - service: mqtt.publish
              data:
                topic: "cmnd/sonoffRF433/Backlog"
                payload: "RfRaw AAA54BBE012202F80A215955; RfRaw 0"
            - service: input_number.set_value
              target:
                entity_id: input_number.ventilador_despatx_rf_on_index
              data:
                value: 4
      default:
        - service: mqtt.publish
          data:
            topic: "cmnd/sonoffRF433/Backlog"
            payload: "RfRaw AAA54C04012202EE0A215F55; RfRaw 0"
        - service: input_number.set_value
          target:
            entity_id: input_number.ventilador_despatx_rf_on_index
          data:
            value: 1

