        volume_level: "{{ ((states('input_number.notification_max_volume') | float(1)) * 0.02 * (0.5 if (now().hour >= (states('input_number.notification_night_start_hour') | int) or now().hour < (states('input_number.notification_night_end_hour') | int)) else 1)) | round(3) }}"
