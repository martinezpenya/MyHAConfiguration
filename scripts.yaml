ventilador_altre_on_std:
  alias: Ventilador altre ON STD
  sequence:
    - repeat:
        count: 2
        sequence:
          - service: mqtt.publish
            data:
              topic: "cmnd/sonoffRF433/Backlog"
              payload: "RfSync 8710; RfLow 280; RfHigh 850; RfCode #57180A; RfCode #57180A"
          - delay:
              milliseconds: 180
          - service: mqtt.publish
            data:
              topic: "cmnd/sonoffRF433/Backlog"
              payload: "RfSync 5750; RfLow 370; RfHigh 610; RfCode #029A80; RfCode #029A80; RfCode #029A80; RfCode #029A80"
          - delay:
              milliseconds: 180
          - service: mqtt.publish
            data:
              topic: "cmnd/sonoffRF433/Backlog"
              payload: "RfSync 5750; RfLow 350; RfHigh 620; RfCode #039B81; RfCode #039B81; RfCode #039B81; RfCode #039B81"
          - delay:
              milliseconds: 180
          - service: mqtt.publish
            data:
              topic: "cmnd/sonoffRF433/Backlog"
              payload: "RfSync 5750; RfLow 370; RfHigh 600; RfCode #009482; RfCode #009482; RfCode #009482; RfCode #009482"
          - delay:
              milliseconds: 180
          - service: mqtt.publish
            data:
              topic: "cmnd/sonoffRF433/Backlog"
              payload: "RfSync 5770; RfLow 330; RfHigh 650; RfCode #35997F; RfCode #35997F; RfCode #35997F; RfCode #35997F"
          - delay:
              milliseconds: 220

