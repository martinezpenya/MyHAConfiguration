yeelight_day:
  alias: Yeelight day
  sequence:       
    # Turn the lights to low brightness at a very warm temperature
    - service: light.turn_on
      data:
        entity_id: light.Yeelight_1
        rgb_color: [255,255,255]
        brightness_pct: 100
        
    # Wait 5 seconds
    - delay: 00:00:10
        
    - service: light.turn_off
      data:
        entity_id: light.Yeelight_1
        transition: 40

yeelight_step:
  sequence:
    - service: light.turn_on
      data_template:
        entity_id: light.Yeelight_1
        transition: '1'
        brightness: >-
          {%- if states.light.Yeelight_1.attributes.brightness <= 20 %}
            63
          {% elif states.light.Yeelight_1.attributes.brightness <= 63 %}
            127
          {% elif states.light.Yeelight_1.attributes.brightness <= 127 %}
            189
          {% elif states.light.Yeelight_1.attributes.brightness <= 189 %}
            255
          {% endif %}

bondiamusica:
  alias: bondiamusica
  sequence: 
    - service: switch.turn_on
      data:
        entity_id: switch.sonoffbasic_3
    - service: telegram_bot.send_message
      data_template:
        message: 'Bon dia!, vols parar la música?'
        inline_keyboard: 
        - '✔Yes:/TCB_speaker_off, ❌No:/TCB_cancel'
    - delay: 00:00:01
    - service: telegram_bot.send_message
      data_template:
        message: 'Bon dia!, vols canviar la posició de les persianes?'
        inline_keyboard: 
        - '🏠 Open:/TCB_shutter_open_all, 💡 Low:/TCB_shutter_low, ❌No:/TCB_cancel'
    - service: media_player.volume_set
      data:
        entity_id: media_player.speaker
        volume_level: "{{ ((states('input_number.notification_max_volume') | float(1)) * 0.0 * (0.5 if (now().hour >= (states('input_number.notification_night_start_hour') | int) or now().hour < (states('input_number.notification_night_end_hour') | int)) else 1)) | round(3) }}"
    - delay: 00:00:01 #wait for switch
    - service: media_player.select_source
      data:
        entity_id: media_player.speaker
        source: RockFM        
    - delay: 00:00:05 
    - service: media_player.volume_set
      data:
        entity_id: media_player.speaker
        volume_level: "{{ ((states('input_number.notification_max_volume') | float(1)) * 0.01 * (0.5 if (now().hour >= (states('input_number.notification_night_start_hour') | int) or now().hour < (states('input_number.notification_night_end_hour') | int)) else 1)) | round(3) }}"
