- alias: Shutter button LEDs when home and dark
  id: shutter_button_leds_home_dark
  initial_state: true
  triggers:
  - trigger: homeassistant
    event: start
    id: start
  - trigger: state
    entity_id: sun.sun
    to: below_horizon
    id: sunset
  - trigger: state
    entity_id: sun.sun
    to: above_horizon
    id: sunrise
  - trigger: state
    entity_id: device_tracker.rdm13nppmovil
    to: home
    id: arrive_home
  - trigger: state
    entity_id: device_tracker.rdm13nppmovil
    to: not_home
    for:
      minutes: 5
    id: leave_home
  - trigger: state
    entity_id: device_tracker.rdm13nppmovil
    to: unavailable
    for:
      minutes: 5
    id: leave_home_unavailable
  variables:
    should_turn_on: '{{ is_state(''device_tracker.rdm13nppmovil'', ''home'') and is_state(''sun.sun'',
      ''below_horizon'') }}'
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ should_turn_on }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id:
          - light.shutter_office_button_led
          - light.shutter_dinner_button_led
          - light.shutter_sleep_button_led
          - light.shutter_room_button_led
      - action: telegram_bot.send_message
        data_template:
          message: The shutter button LEDs have been turned on.
    - conditions:
      - condition: template
        value_template: '{{ trigger.id != ''start'' }}'
      sequence:
      - action: light.turn_off
        target:
          entity_id:
          - light.shutter_office_button_led
          - light.shutter_dinner_button_led
          - light.shutter_sleep_button_led
          - light.shutter_room_button_led
      - action: telegram_bot.send_message
        data_template:
          message: The shutter button LEDs have been turned off.
    default:
    - action: light.turn_off
      target:
        entity_id:
        - light.shutter_office_button_led
        - light.shutter_dinner_button_led
        - light.shutter_sleep_button_led
        - light.shutter_room_button_led
  mode: single
- alias: Shutter LEDs refresh on HA start
  triggers:
  - trigger: homeassistant
    event: start
  actions:
  - delay: 00:00:20
  - action: mqtt.publish
    data:
      topic: cmnd/shutter_office/state
      payload: ''
  - action: mqtt.publish
    data:
      topic: cmnd/shutter_dinner/state
      payload: ''
  - action: mqtt.publish
    data:
      topic: cmnd/shutter_sleep/state
      payload: ''
  - action: mqtt.publish
    data:
      topic: cmnd/shutter_room/state
      payload: ''
  - action: mqtt.publish
    data:
      topic: cmnd/shutter_office/tuyasend0
      payload: ''
  - action: mqtt.publish
    data:
      topic: cmnd/shutter_dinner/tuyasend0
      payload: ''
  - action: mqtt.publish
    data:
      topic: cmnd/shutter_sleep/tuyasend0
      payload: ''
  - action: mqtt.publish
    data:
      topic: cmnd/shutter_room/tuyasend0
      payload: ''
  mode: single
  id: a6297a1609634837a34ba1b9d0aea819
- alias: Shutter LEDs sync input_boolean from MQTT
  triggers:
  - trigger: mqtt
    topic: stat/shutter_office/EFFECT
    payload: 7,1
    id: office_on
  - trigger: mqtt
    topic: stat/shutter_office/EFFECT
    payload: 7,0
    id: office_off
  - trigger: mqtt
    topic: stat/shutter_dinner/EFFECT
    payload: 7,1
    id: dinner_on
  - trigger: mqtt
    topic: stat/shutter_dinner/EFFECT
    payload: 7,0
    id: dinner_off
  - trigger: mqtt
    topic: stat/shutter_sleep/EFFECT
    payload: 7,1
    id: sleep_on
  - trigger: mqtt
    topic: stat/shutter_sleep/EFFECT
    payload: 7,0
    id: sleep_off
  - trigger: mqtt
    topic: stat/shutter_room/EFFECT
    payload: 7,1
    id: room_on
  - trigger: mqtt
    topic: stat/shutter_room/EFFECT
    payload: 7,0
    id: room_off
  - trigger: mqtt
    topic: stat/shutter_office/RESULT
    id: office_result
  - trigger: mqtt
    topic: stat/shutter_dinner/RESULT
    id: dinner_result
  - trigger: mqtt
    topic: stat/shutter_sleep/RESULT
    id: sleep_result
  - trigger: mqtt
    topic: stat/shutter_room/RESULT
    id: room_result
  variables:
    effect_value: "{% if trigger.topic.endswith('/EFFECT') %}\n  {{ trigger.payload
      | trim }}\n{% elif trigger.topic.endswith('/RESULT') %}\n  {% set result = trigger.payload
      | from_json(default={}) %}\n  {% set tuya = result.get('TuyaReceived', {}) %}\n
      \ {% set dp = tuya.get('7') %}\n  {% if dp is not none %}\n    {{ '7,' ~ dp
      }}\n  {% else %}\n    unknown\n  {% endif %}\n{% else %}\n  unknown\n{% endif
      %}"
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.topic.startswith(''stat/shutter_office/'') and
          effect_value == ''7,1'' }}'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.shutter_office_led_state
    - conditions:
      - condition: template
        value_template: '{{ trigger.topic.startswith(''stat/shutter_office/'') and
          effect_value == ''7,0'' }}'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.shutter_office_led_state
    - conditions:
      - condition: template
        value_template: '{{ trigger.topic.startswith(''stat/shutter_dinner/'') and
          effect_value == ''7,1'' }}'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.shutter_dinner_led_state
    - conditions:
      - condition: template
        value_template: '{{ trigger.topic.startswith(''stat/shutter_dinner/'') and
          effect_value == ''7,0'' }}'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.shutter_dinner_led_state
    - conditions:
      - condition: template
        value_template: '{{ trigger.topic.startswith(''stat/shutter_sleep/'') and
          effect_value == ''7,1'' }}'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.shutter_sleep_led_state
    - conditions:
      - condition: template
        value_template: '{{ trigger.topic.startswith(''stat/shutter_sleep/'') and
          effect_value == ''7,0'' }}'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.shutter_sleep_led_state
    - conditions:
      - condition: template
        value_template: '{{ trigger.topic.startswith(''stat/shutter_room/'') and effect_value
          == ''7,1'' }}'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.shutter_room_led_state
    - conditions:
      - condition: template
        value_template: '{{ trigger.topic.startswith(''stat/shutter_room/'') and effect_value
          == ''7,0'' }}'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.shutter_room_led_state
