- sensor:
  - device_class: apparent_power
    unit_of_measurement: VA
    default_entity_id: sensor.shelly2_apparent_power
    name: Shelly2 Apparent Power
    state: '{{ ((states(''sensor.shelly2_real_power'')|float(0) ** 2) + (states(''sensor.shelly2_reactive_power'')|float(0)
      ** 2))|sqrt|round(2) }}'
    availability: '{{ has_value(''sensor.shelly2_real_power'') and has_value(''sensor.shelly2_reactive_power'') }}'
- sensor:
  - device_class: power_factor
    default_entity_id: sensor.shelly2_power_factor
    name: Shelly2 Power Factor
    state: '{{ ((states(''sensor.shelly2_real_power'')|float(0)) / (states(''sensor.shelly2_apparent_power'')|float(0)
      or 1))|round(2) }}'
    availability: '{{ has_value(''sensor.shelly2_real_power'') and has_value(''sensor.shelly2_apparent_power'') }}'
- sensor:
  - device_class: current
    unit_of_measurement: A
    default_entity_id: sensor.shelly2_current_draw
    name: Shelly2 Current Draw
    state: '{{ ((states(''sensor.shelly2_apparent_power'')|float(0)) / (states(''sensor.shelly2_voltage'')|float(0)
      or 1))|round(2) }}'
    availability: '{{ has_value(''sensor.shelly2_apparent_power'') and has_value(''sensor.shelly2_voltage'') }}'