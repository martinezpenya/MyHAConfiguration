# Despacho y ordenador (switch.sw03_8tree): al encenderlo o apagarlo, la
# persiana del despacho pasa a la posición que le toca
# (custom_templates/persianas.jinja, despacho_pc):
#   ordenador encendido y sol en el balcón -> sombra suave, 50 % (si toca sombra)
#   ordenador encendido y el balcón ya da sombra -> 100 %
#   ordenador apagado                      -> lo normal
# Cuando la sombra del balcón tapa el sol (binary_sensor.sol_fachada_despacho a
# off), la abre Persianas_Proteccion_Solar.yaml. La lluvia y la noche siguen
# mandando. Ver packages/persianas.yaml.
- alias: 'Persianas despacho ordenador'
  id: persianas_despacho_ordenador
  initial_state: true
  triggers:
    - trigger: state
      entity_id: switch.sw03_8tree
      from: 'off'
      to: 'on'
      id: encendido
    - trigger: state
      entity_id: switch.sw03_8tree
      from: 'on'
      to: 'off'
      id: apagado
  variables:
    ideal: >-
      {% from 'persianas.jinja' import persiana_ideal %}{{ persiana_ideal('office') }}
  actions:
    - action: script.persiana_mover
      data:
        persiana: office
        posicion: "{{ ideal.split('|')[0] | int }}"
        motivo: >-
          {{ ('has apagado el ordenador; ' if trigger.id == 'apagado' else '') ~ ideal.split('|')[1] }}
  mode: single
