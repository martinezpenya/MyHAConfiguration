##########################################
## KEYBOARD - Printer_off
##
- alias: 'TC_Printer_off'
  initial_state: true
  trigger:
    platform: event
    event_type: telegram_command
    event_data:
      command: '/Printer_off'
  actions:
    - action: telegram_bot.send_message
      data_template:
        message: "Printer off"
    - action: switch.turn_off
      data:
        entity_id:
          - switch.sonoffPrinter
