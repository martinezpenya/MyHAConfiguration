- id: wh_timer1
  alias: Timer1
  trigger:
    platform: template
    value_template: "{{ states.sensor.time.state == states.sensor.timer1_time.state }}"
  condition:
    condition: or
    conditions:
      - condition: and
        conditions:
          - condition: state
            entity_id: input_boolean.programweekday1
            state: 'on'
          - condition: time
            weekday:
              - mon
              - tue
              - wed
              - thu
              - fri
      - condition: state
        entity_id: input_boolean.programweekday1
        state: 'off'
  actions:
    - action: telegram_bot.send_message
      data_template:
        message: "Timer 1 - waterheater on"
    - action: switch.turn_on
      data:
        entity_id:
          - switch.BliTZW0lF_1
    - delay: "{{states.sensor.timer1_duration.state}}"
    - action: switch.turn_off
      data:
        entity_id:
          - switch.BliTZW0lF_1          
    - action: telegram_bot.send_message
      data_template:
        message: "Timer 1 - waterheater off"
