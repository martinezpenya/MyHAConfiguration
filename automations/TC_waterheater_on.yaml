##########################################
## KEYBOARD - waterheater_on
##
- alias: 'TC_waterheater_on'
  initial_state: true
  trigger:
    platform: event
    event_type: telegram_command
    event_data:
      command: '/waterheater_on'
  action:
    - action: telegram_bot.send_message
      data_template:
        message: "waterheater on"
    - service: switch.turn_on
      data:
        entity_id:
          - switch.BliTZW0lF_1
