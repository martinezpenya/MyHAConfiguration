##########################################
## KEYBOARD - waterheater_on
##
- alias: 'TC_waterheater_on'
  id: tc_waterheater_on
  initial_state: true
  triggers:
    - trigger: event
      event_type: telegram_command
      event_data:
        command: '/waterheater_on'
  actions:
    - action: telegram_bot.send_message
      data:
        message: "waterheater on"
    - action: switch.turn_on
      data:
        entity_id:
          - switch.BliTZW0lF_1
