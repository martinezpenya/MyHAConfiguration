## KEYBOARD - waterheater_off
##
- alias: 'TC_waterheater_off'
  id: tc_waterheater_off
  initial_state: true
  triggers:
    - trigger: event
      event_type: telegram_command
      event_data:
        command: '/waterheater_off'
  actions:
    - action: telegram_bot.send_message
      data:
        message: "waterheater off"
    - action: switch.turn_off
      data:
        entity_id:
          - switch.BliTZW0lF_1
