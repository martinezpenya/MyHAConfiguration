##########################################
## KEYBOARD - start
##
- alias: 'TC start'
  id: tc_start
  initial_state: true
  triggers:
    - trigger: event
      event_type: telegram_command
      event_data:
        command: '/start'
  actions:
    - action: telegram_bot.send_message
      data:
        message: 'Select an option'
        keyboard:
          - '/status, /gas95, /ping'
          - '/lights'
          - '/waterheater, /TVset' 
          #, /Printer'
          - '/computer, /3dprinter, /shutter'
          #- '/alarma, /puertas, /switches'