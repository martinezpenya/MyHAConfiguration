##########################################
## KEYBOARD - start
##
- alias: 'TC start'
  initial_state: true
  trigger:
     - platform: event
       event_type: telegram_command
       event_data:
         command: '/start'
  actions:
    - action: telegram_bot.send_message
      data_template:
        message: 'Select an option'
        keyboard:
          - '/status, /gas95, /ping'
          - '/lights'
          - '/waterheater, /TVset' 
          #, /Printer'
          - '/computer, /3dprinter, /shutter'
          #- '/alarma, /puertas, /switches'