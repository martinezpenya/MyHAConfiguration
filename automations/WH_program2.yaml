- id: wh_timer2
  alias: 'Timer2'
  triggers:
    - trigger: template
      value_template: '{{ states.sensor.time.state == states.sensor.timer2_time.state }}'
  conditions:
    - condition: or
      conditions:
        - condition: and
          conditions:
            - condition: state
              entity_id: input_boolean.programweekday2
              state: 'on'
            - condition: time
              weekday:
                - mon
                - tue
                - wed
                - thu
                - fri
        - condition: state
          entity_id: input_boolean.programweekday2
          state: 'off'
  actions:
    - action: telegram_bot.send_message
      data:
        message: "Timer 2 - waterheater on"
    - action: switch.turn_on
      data:
        entity_id:
          - switch.BliTZW0lF_1
    - delay: "{{states.sensor.timer2_duration.state}}"
    - action: switch.turn_off
      data:
        entity_id:
          - switch.BliTZW0lF_1
    - action: telegram_bot.send_message
      data:
        message: "Timer 2 - waterheater off"
