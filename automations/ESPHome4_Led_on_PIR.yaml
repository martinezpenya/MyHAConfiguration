- alias: ESPHome4 led on pir
  id: esphome4_led_on_pir
  triggers:
    - trigger: state
      entity_id: binary_sensor.esphome4_motion
      to: "on"
  actions:
    - action: light.turn_on
      data:
        entity_id: light.esphome4_light
        brightness: 30
        rgb_color:
          - 255
          - 0
          - 0
