##########################################
## INLINE_KEYBOARD - TCB_socket_ambibany_off
##
- alias: 'TCB_socket_ambibany_off'
  id: tcb_socket_ambibany_off
  initial_state: true
  triggers:
    - trigger: event
      event_type: telegram_callback
      event_data:
        data: '/TCB_socket_ambibany_off'
  actions:
    - action: telegram_bot.answer_callback_query
      data:
        callback_query_id: '{{ trigger.event.data.id }}'
        message: 'Switching Ambi bany socket off'
    - action: switch.turn_off
      data:
        entity_id:
          - switch.sonoffambibany
    - delay: 00:00:01
    - action: telegram_bot.edit_replymarkup
      data:
        message_id: 'last'
        chat_id: '{{ trigger.event.data.chat_id }}'
        inline_keyboard: !include TCB_sockets_menu_buttons.btn