##########################################
## INLINE_KEYBOARD - TCB_shutter_room_close
##
- alias: 'TCB_shutter_room_close'
  id: tcb_shutter_room_close
  initial_state: true
  triggers:
    - trigger: event
      event_type: telegram_callback
      event_data:
        data: '/TCB_shutter_room_close'
  actions:
    - action: cover.close_cover
      target:
        entity_id: cover.shutter_room
    - action: telegram_bot.answer_callback_query
      data:
        callback_query_id: '{{ trigger.event.data.id }}'
        message: 'Switching Room Shutter to close'
    - delay: 00:00:30
    - action: telegram_bot.edit_replymarkup
      data:
        message_id: 'last'
        chat_id: '{{ trigger.event.data.chat_id }}'
        inline_keyboard: !include TCB_shutter_menu_buttons.btn