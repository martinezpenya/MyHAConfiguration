##########################################
## INLINE_KEYBOARD - TCB_shutter_dinner_stop
##
- alias: 'TCB_shutter_dinner_stop'
  id: tcb_shutter_dinner_stop
  initial_state: true
  triggers:
    - trigger: event
      event_type: telegram_callback
      event_data:
        data: '/TCB_shutter_dinner_stop'
  actions:
    - action: cover.stop_cover
      target:
        entity_id: cover.shutter_dinner
    - action: telegram_bot.answer_callback_query
      data:
        callback_query_id: '{{ trigger.event.data.id }}'
        message: 'Switching Dinner Shutter to stop'
    - delay: 00:00:01
    - action: telegram_bot.edit_replymarkup
      data:
        message_id: 'last'
        chat_id: '{{ trigger.event.data.chat_id }}'
        inline_keyboard: !include TCB_shutter_menu_buttons.btn