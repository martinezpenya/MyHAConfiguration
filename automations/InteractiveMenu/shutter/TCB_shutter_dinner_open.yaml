##########################################
## INLINE_KEYBOARD - TCB_shutter_dinner_open
##
- alias: 'TCB_shutter_dinner_open'
  initial_state: true
  trigger:
    platform: event
    event_type: telegram_callback
    event_data:
      data: '/TCB_shutter_dinner_open'
  action:
    - service: cover.open_cover
      target:
        entity_id: cover.shutter_dinner
    - delay: 00:00:30
    - service: telegram_bot.answer_callback_query
      data_template:
        callback_query_id: '{{ trigger.event.data.id }}'
        message: 'Switching Dinner Shutter to open'
    - service: telegram_bot.edit_replymarkup
      data_template:
        message_id: 'last'
        chat_id: '{{ trigger.event.data.chat_id }}'
        inline_keyboard: !include TCB_shutter_menu_buttons.btn