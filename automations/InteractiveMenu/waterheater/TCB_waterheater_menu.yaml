##########################################
## INLINE_KEYBOARD - TCB_waterheater_menu
##
- alias: 'TCB_waterheater_menu'
  id: tcb_waterheater_menu
  initial_state: true
  triggers:
    - trigger: event
      event_type: telegram_callback
      event_data:
        data: '/TCB_waterheater_menu'
  actions:
    - action: telegram_bot.answer_callback_query
      data:
        callback_query_id: '{{ trigger.event.data.id }}'
        message: 'WaterHeater menu selected'
    - action: telegram_bot.edit_message
      data:
        message_id: '{{ trigger.event.data.message.message_id }}'
        chat_id: '{{ trigger.event.data.chat_id }}'
        message: "\U0001f525 ***WaterHeater*** \U0001f525"
    - action: telegram_bot.edit_replymarkup
      data:
        message_id: 'last'
        chat_id: '{{ trigger.event.data.chat_id }}'
        inline_keyboard: !include TCB_waterheater_menu_buttons.btn

