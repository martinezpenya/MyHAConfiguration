##########################################
## INLINE_KEYBOARD - TCB_waterheater_timerstopped
##
- alias: 'TCB_waterheater_timerstopped'
  id: tcb_waterheater_timerstopped
  initial_state: true
  triggers:
  - event_data:
      entity_id: timer.waterheater
    event_type: timer.finished
    trigger: event
  conditions: []
  actions:
    - action: switch.turn_off
      data:
        entity_id:
          - switch.BliTZW0lF_1
    - delay: 00:00:01
    - action: telegram_bot.send_message
      data:
        message: 'WaterHeater timer ended'
    - action: telegram_bot.edit_replymarkup
      data:
        message_id: 'last'
        chat_id: !secret id_group_telegram
        inline_keyboard: !include TCB_waterheater_menu_buttons.btn