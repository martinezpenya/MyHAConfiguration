##########################################
## INLINE_KEYBOARD - TCB_waterheater_30
##
- alias: 'TCB_waterheater_30'
  id: tcb_waterheater_30
  initial_state: true
  triggers:
    - trigger: event
      event_type: telegram_callback
      event_data:
        data: '/TCB_waterheater_30'
  actions:
    - action: telegram_bot.answer_callback_query
      data:
        callback_query_id: '{{ trigger.event.data.id }}'
        message: 'WaterHeater on for 30 minutes'
    - action: timer.start
      data:
        duration: 00:30:00
        entity_id: timer.waterheater
    - action: switch.turn_on
      data:
        entity_id:
          - switch.BliTZW0lF_1
    - delay: 00:00:01
    - action: telegram_bot.edit_replymarkup
      data:
        message_id: 'last'
        chat_id: '{{ trigger.event.data.chat_id }}'
        inline_keyboard: !include TCB_waterheater_menu_buttons.btn