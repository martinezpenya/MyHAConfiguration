##########################################
## INLINE_KEYBOARD - TCB_gasolina_refresh
##
- alias: 'TCB_gasolina_refresh'
  id: tcb_gasolina_refresh
  initial_state: true
  triggers:
    - trigger: event
      event_type: telegram_callback
      event_data:
        data: '/TCB_gasolina_refresh'
  actions:
    - action: telegram_bot.answer_callback_query
      data:
        callback_query_id: '{{ trigger.event.data.id }}'
        message: 'Refresh Gasolina menu'
    - delay: 00:00:01
    - action: telegram_bot.edit_message
      data:
        message_id: 'last'
        chat_id: '{{ trigger.event.data.chat_id }}'
        disable_web_page_preview: yes
        message: !include TCB_gasolina_menu_message.msg
    - action: telegram_bot.edit_replymarkup
      data:
        message_id: 'last'
        chat_id: '{{ trigger.event.data.chat_id }}'
        inline_keyboard: !include TCB_gasolina_menu_buttons.btn