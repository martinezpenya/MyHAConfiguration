##########################################
## INLINE_KEYBOARD - TCB_gasolina_menu
##
- alias: 'TCB_gasolina_menu'
  initial_state: true
  trigger:
    platform: event
    event_type: telegram_callback
    event_data:
      data: '/TCB_gasolina_menu'
  action:
    - service: telegram_bot.answer_callback_query
      data_template:
        callback_query_id: '{{ trigger.event.data.id }}'
        message: 'Gasolina menu selected'
    - service: telegram_bot.edit_message
      data_template:
        message_id: 'last' 
#{{ trigger.event.data.message.message_id }}'
        chat_id: '{{ trigger.event.data.chat_id }}'
        disable_web_page_preview: yes
        message: >-
          {{"\U000026fd ***Gasolina 95*** \U000026fd\n"}}
          {{"\n*Fuentes API:*\n"}}
          {% for src in ['sensor.gasolinera1','sensor.gasolinera2','sensor.gasolinera3'] %}
          {{"- " + src + ": `" + states(src) + "`\n"}}
          {% endfor %}
          {{"\n"}}
          {% set zones = [
            ('Carlet', ['sensor.gasolinera11','sensor.gasolinera14','sensor.gasolinera15','sensor.gasolinera16','sensor.gasolinera17']),
            ('Catadau', ['sensor.gasolinera21','sensor.gasolinera22']),
            ('Alcudia', ['sensor.gasolinera31','sensor.gasolinera32','sensor.gasolinera33','sensor.gasolinera34','sensor.gasolinera35','sensor.gasolinera36'])
          ] %}
          {% for zone_name, stations in zones %}
          {{"\n*" + zone_name + "*\n"}}
          {% for entity_id in stations %}
          {% set label = state_attr(entity_id, 'friendly_name') | default(entity_id, true) %}
          {% set value = states(entity_id) %}
          {% if value in ['unknown', 'unavailable', 'none', 'None', ''] %}
          {{"- `N/D` ___(" + label + ")___\n"}}
          {% else %}
          {{"- `" + (value | replace('.', ',')) + " €/L` ___(" + label + ")___\n"}}
          {% endif %}
          {% endfor %}
          {% endfor %}
    - service: telegram_bot.edit_replymarkup
      data_template:
        message_id: 'last'
        chat_id: '{{ trigger.event.data.chat_id }}'
        inline_keyboard: !include TCB_gasolina_menu_buttons.btn
