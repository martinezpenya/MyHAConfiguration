## INLINE_KEYBOARD - TCB_wcfan_timerstopped
##
- alias: 'TCB_wcfan_timerstopped'
  id: tcb_wcfan_timerstopped
  initial_state: true
  triggers:
  - event_data:
      entity_id: timer.timer_sonoff_basic_2
    event_type: timer.finished
    trigger: event
  conditions: []
  actions:
    - action: switch.turn_off
      data:
        entity_id:
          - switch.ventilador_wc
    # Solo el aviso: antes se le añadía el teclado del ventilador (edit_replymarkup
    # sobre el último mensaje, que era este mismo aviso)
    - action: telegram_bot.send_message
      data:
        message: 'WC Fan timer ended'