##########################################
## INLINE_KEYBOARD - launcher
## Publica un teclado fijo con accesos directos a cada seccion (los recoge
## TC_quick_menu.yaml) y al menu principal (TC_start_menu.yaml).
## Se envia al iniciar HA y bajo demanda con /menu_launcher.
##
- alias: 'TC menu launcher'
  id: tc_menu_launcher
  initial_state: true
  triggers:
    - trigger: homeassistant
      id: ha_start
      event: start
    - trigger: event
      id: manual
      event_type: telegram_command
      event_data:
        command: '/menu_launcher'
  actions:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ trigger.id == 'ha_start' }}"
          sequence:
            - delay: '00:00:20'
    - action: telegram_bot.send_message
      data:
        chat_id: !secret id_group_telegram
        message: "\U0001F4CC *Launcher del menu*\nUsa los botones de abajo para abrir cada menu."
        resize_keyboard: true
        keyboard:
          - '💡 Luces, 🔌 Enchufes'
          - '🔥 Termo, 🌀 Ventilador WC'
          - '📶 Persianas, 📢 Música'
          - '⛽ Gasolina, 🌡️ Sensores'
          - '🏠 Menú'
