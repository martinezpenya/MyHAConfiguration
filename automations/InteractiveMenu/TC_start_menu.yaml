##########################################
## KEYBOARD - start
##
- alias: 'TC start menu'
  id: tc_start_menu
  triggers:
     - trigger: event
       event_type: telegram_command
       event_data:
         command: '/menu'
     # Botón del teclado fijo que envía TC_menu_launcher.yaml
     # (requiere el modo privacidad del bot desactivado en BotFather)
     - trigger: event
       event_type: telegram_text
       event_data:
         text: '🏠 Menú'
  actions:
     - action: telegram_bot.send_message
       data:
         message: "\U0001f3e0 ***HA Bot - Main Menu*** \U0001f3e0"
         inline_keyboard:
           !include TCB_start_menu_buttons.btn