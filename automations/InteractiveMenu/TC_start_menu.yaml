##########################################
## KEYBOARD - start
##
- alias: 'TC start menu'
  id: tc_start_menu
  triggers:
     - trigger: event
       event_type: telegram_command
       event_data:
         command: '/start_menu'
     - trigger: event
       event_type: telegram_command
       event_data:
         command: '/menu'
     - trigger: event
       event_type: telegram_command
       event_data:
         command: '/ha_menu'
  actions:
     - action: telegram_bot.send_message
       data:
         message: "\U0001f3e0 ***HA Bot - Main Menu*** \U0001f3e0"
         inline_keyboard:
           !include TCB_start_menu_buttons.btn