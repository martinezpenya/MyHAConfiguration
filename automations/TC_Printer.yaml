##########################################
## KEYBOARD - Printer
##
- alias: 'TC Printer'
  initial_state: true
  trigger:
     - platform: event
       event_type: telegram_command
       event_data:
         command: '/Printer'
  actions:
    - action: telegram_bot.send_message
      data_template:
        message: 'Select an option'
        keyboard:
        - '/Printer_on, /Printer_off'
        - '/start'
                