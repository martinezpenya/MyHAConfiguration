# Foto del movimiento sacada por HA del vídeo RTSP (camera.yiN, ffmpeg) en el
# momento del motion_start. La foto que publica yi-hack en
# yicamN/motion_detection_image se captura ~35 s tarde, así que no se usa.
# El aviso de texto va aparte (Yi_Cameras_Motion_Telegram.yaml): si falla la
# captura, el aviso llega igualmente.
- alias: 'Yi cameras motion snapshot Telegram'
  id: yi_cameras_motion_snapshot_telegram
  initial_state: true
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.yi1_motion_detection
        - binary_sensor.yi2_motion_detection
      # from 'off' para no disparar cuando la cámara vuelve de 'unavailable' tras reiniciar
      from: 'off'
      to: 'on'
  conditions:
    - condition: or
      conditions:
        - condition: state
          entity_id: device_tracker.rdm13nppmovil
          state: 'not_home'
        - condition: state
          entity_id: device_tracker.rdm13nppmovil
          state: 'unavailable'
  variables:
    cam: "{{ trigger.entity_id.split('.')[1].split('_')[0] }}"
    file: "/config/snapshots/{{ cam }}_motion.jpg"
  actions:
    # Si la captura falla, la automatización se para aquí y no se envía una foto antigua
    - action: camera.snapshot
      target:
        entity_id: "camera.{{ cam }}"
      data:
        filename: "{{ file }}"
    - action: telegram_bot.send_photo
      data:
        file: "{{ file }}"
        caption: "\U0001F4F9 {{ cam }} ({{ now().strftime('%H:%M:%S') }})"
  mode: queued
