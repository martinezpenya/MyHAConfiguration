##########################################
## KEYBOARD - TVset_on
##
- alias: 'TC_TVset_on'
  initial_state: true
  trigger:
    platform: event
    event_type: telegram_command
    event_data:
      command: '/TVset_on'
  action:
    - action: telegram_bot.send_message
      data_template:
        message: "TVset on"
    - service: switch.turn_on
      data:
        entity_id:
          - switch.blitzw0lf_6
