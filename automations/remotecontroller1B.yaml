###############################
# Remote controller 4 buttons

###############################
# Button B

- alias: Remote1ButtonB
  id: remote1_buttonb
  initial_state: true
  triggers:
    - trigger: state
      entity_id: binary_sensor.remote1_btnb
      to: 'on'
  actions:
    - action: telegram_bot.send_message
      data:
        message: "Remote1 buttonB pressed"
    - if:
        - condition: state
          entity_id: switch.sw03_8tree
          state: 'on'
      then:
        - action: telegram_bot.send_message
          data:
            message: "computer off"
        - action: switch.turn_off
          target:
            entity_id: switch.sw03_8tree
      else:
        - action: telegram_bot.send_message
          data:
            message: "computer on"
        - action: switch.turn_on
          target:
            entity_id: switch.sw03_8tree
