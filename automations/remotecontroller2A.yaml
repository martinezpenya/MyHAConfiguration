###############################
# Remote controller 2 (4 buttons)

###############################
# Button A

- alias: Remote2ButtonA
  id: remote2_buttona
  initial_state: true
  triggers:
    - trigger: state
      entity_id: binary_sensor.remote2_btna
      to: 'on'
  actions:
    - action: telegram_bot.send_message
      data:
        message: "Remote2 buttonA pressed"
