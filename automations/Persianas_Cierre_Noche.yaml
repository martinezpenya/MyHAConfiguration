# Persianas de noche (sol por debajo de -4°, poco después de la puesta):
#   frío  -> cierre total (0 %) al anochecer, para conservar el calor
#   calor -> abiertas mientras estás despierto en casa; al 25 % (corriente de
#            aire) cuando te vas a dormir (GPS en casa y wifi apagado: al
#            momento desde las 23:00, con 5 min de margen antes) o si estás fuera
# La posición la decide custom_templates/persianas.jinja (persiana_ideal). La
# vuelta a casa de noche la gestiona Persianas_Llegada.yaml.
# Ver packages/persianas.yaml.
- alias: 'Persianas cierre noche'
  id: persianas_cierre_noche
  initial_state: true
  triggers:
    - trigger: numeric_state
      entity_id: sun.sun
      attribute: elevation
      below: -4
      id: anochecer
    # Desde las 23:00 apagar el wifi es irse a dormir: al momento. Antes, con
    # 5 min de margen por si es un corte de wifi
    - trigger: state
      entity_id: binary_sensor.persianas_durmiendo
      from: 'off'
      to: 'on'
      id: dormir_ya
    - trigger: state
      entity_id: binary_sensor.persianas_durmiendo
      from: 'off'
      to: 'on'
      for: "00:05:00"
      id: dormir
    - trigger: state
      entity_id: binary_sensor.persianas_fuera
      from: 'off'
      to: 'on'
      id: salir
  conditions:
    - condition: numeric_state
      entity_id: sun.sun
      attribute: elevation
      below: -4
    - condition: template
      value_template: "{{ trigger.id != 'dormir_ya' or now().hour >= 23 or now().hour < 5 }}"
  actions:
    - repeat:
        for_each:
          - office
          - dinner
          - sleep
          - room
        sequence:
          - variables:
              ideal: >-
                {% from 'persianas.jinja' import persiana_ideal %}{{ persiana_ideal(repeat.item) }}
          - action: script.persiana_mover
            data:
              persiana: "{{ repeat.item }}"
              posicion: "{{ ideal.split('|')[0] | int }}"
              motivo: "{{ ideal.split('|')[1] }}"
  mode: queued
