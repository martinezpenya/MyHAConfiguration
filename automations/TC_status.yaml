##########################################
## KEYBOARD - status
##
- alias: 'TC status'
  id: tc_status
  initial_state: true
  triggers:
    - trigger: event
      event_type: telegram_command
      event_data:
        command: '/status'
  actions:
    - action: telegram_bot.send_message
      data:
          title: "***Sensors:***"
          message: "{% for state in states.sensor -%}
                    {%- if loop.first %}  - {% elif loop.last %} \n - {% else %}\n - {% endif -%}
                      {{ state.name | lower }}: ***{{state.state_with_unit}}***
                    {%- endfor %}"