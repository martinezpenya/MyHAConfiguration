###############################
# Remote controller 4 buttons

###############################
# Button C

- alias: Remote1ButtonC
  id: remote1_buttonc
  initial_state: true
  triggers:
    - trigger: state
      entity_id: binary_sensor.remote1_btnc
      to: 'on'
  actions:
    - action: telegram_bot.send_message
      data:
        message: "Remote1 buttonC pressed"