# Button C

- alias: Remote1ButtonC
  initial_state: true
  trigger:
    platform: state
    entity_id: binary_sensor.remote1_btnc
    to: 'on'
  action:
    - action: telegram_bot.send_message
      data_template:
        message: "Remote1 buttonC pressed"